<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Supprimer une Facture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4" style="max-width:600px; margin:auto;">
        <h3 class="text-danger mb-4">⚠️ Confirmation de suppression</h3>
        <p>Voulez-vous vraiment supprimer la facture <strong>{{ object.numero_facture }}</strong>
           du client <strong>{{ object.nom_client }}</strong> ?</p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-between mt-4">
                <button type="submit" class="btn btn-danger">🗑️ Supprimer</button>
                <a href="{% url 'liste_factures' %}" class="btn btn-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
